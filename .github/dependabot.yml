version: 2
updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: composer
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      php-patch-and-minor:
        patterns: ['*']
        update-types: ['patch', 'minor']

  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      js-patch-and-minor:
        patterns: ['*']
        update-types: ['patch', 'minor']
