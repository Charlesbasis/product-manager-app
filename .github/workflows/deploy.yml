name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      rollback_to:
        description: 'Release id to roll back to (leave empty for a normal deploy)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # Required gates. A failing test, lint or type check blocks the build, and a
  # failing build blocks the deploy.
  tests:
    if: github.event_name == 'push' || inputs.rollback_to == ''
    uses: ./.github/workflows/tests.yml

  lint:
    if: github.event_name == 'push' || inputs.rollback_to == ''
    uses: ./.github/workflows/lint.yml

  build:
    name: Build release artifact
    needs: [tests, lint]
    if: github.event_name == 'push' || inputs.rollback_to == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
          extensions: mbstring, intl, gd, zip, bcmath, exif, curl, dom, fileinfo, pdo_sqlite, sqlite3

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.18.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Prepare build environment
        run: cp .env.example .env

      # vendor/ is built once here with production dependencies. The server
      # never runs Composer, pnpm or Vite.
      - name: Install production PHP dependencies
        run: >-
          composer install
          --no-dev
          --no-scripts
          --no-ansi
          --no-interaction
          --no-progress
          --prefer-dist
          --optimize-autoloader
          --classmap-authoritative

      - name: Generate throwaway build key
        run: php artisan key:generate --force

      - name: Discover packages
        run: php artisan package:discover --ansi --no-interaction

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend and SSR bundle
        run: pnpm run build:ssr

      - name: Create release tarball
        run: |
          tar -czf release.tar.gz \
            --exclude='bootstrap/cache/*.php' \
            --exclude='database/*.sqlite*' \
            --exclude='public/hot' \
            --exclude='public/storage' \
            --exclude='public/build/hot' \
            app bootstrap config database deploy public resources routes vendor \
            artisan composer.json composer.lock ecosystem.config.cjs

      - name: Verify release contents
        run: |
          set -euo pipefail
          tar -tzf release.tar.gz > release.list

          for required in \
            artisan \
            vendor/autoload.php \
            public/.htaccess \
            public/build/manifest.json \
            bootstrap/ssr/ssr.js \
            ecosystem.config.cjs \
            deploy/activate.sh; do
            grep -qx "$required" release.list || {
              echo "::error::release is missing $required"
              exit 1
            }
          done

          if grep -Eq '(^|/)\.env($|\.)' release.list; then
            echo "::error::release contains an .env file"
            exit 1
          fi

          if grep -Eq '^(tests/|node_modules/|\.git/|storage/)' release.list; then
            echo "::error::release contains development or runtime data"
            exit 1
          fi

          echo "release size: $(du -h release.tar.gz | cut -f1)"
          echo "release files: $(wc -l < release.list)"

      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release.tar.gz
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy to production
    needs: build
    if: github.event_name == 'push' || inputs.rollback_to == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || secrets.REMOTE_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || secrets.REMOTE_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Verify deploy configuration
        run: |
          set -euo pipefail
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH SSH_PRIVATE_KEY SSH_HOST_FINGERPRINT; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured (repository variable or secret)"
              missing=1
            fi
          done
          exit "$missing"

      - name: Upload release tarball
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          fingerprint: ${{ env.SSH_HOST_FINGERPRINT }}
          source: dist/release.tar.gz
          target: ${{ env.DEPLOY_PATH }}
          # The artifact is uploaded from dist/; strip that leading directory
          # so activate fills $DEPLOY_PATH/release.tar.gz, not dist/release.tar.gz.
          strip_components: 1
          overwrite: true
          timeout: 60s
          command_timeout: 5m

      - name: Activate release
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          BASE: ${{ env.DEPLOY_PATH }}
          SHA: ${{ github.sha }}
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          fingerprint: ${{ env.SSH_HOST_FINGERPRINT }}
          envs: BASE,SHA
          command_timeout: 15m
          script: |
            set -euo pipefail

            TARBALL="$BASE/release.tar.gz"
            STAGE="$BASE/releases/$SHA.tmp"
            FINAL="$BASE/releases/$SHA"

            case "$SHA" in
              *[!0-9a-fA-F]*)
                echo "invalid commit sha: $SHA"
                exit 1
                ;;
            esac

            [ -f "$TARBALL" ] || { echo "release tarball is missing"; exit 1; }

            # A re-run of the same commit must never delete the release that is
            # currently serving. Suffix the id instead.
            if [ -e "$FINAL" ]; then
              FINAL="$FINAL-$(date -u +%Y%m%d%H%M%S)"
            fi
            RELEASE_ID="$(basename "$FINAL")"

            mkdir -p "$BASE/releases" "$BASE/tmp"
            rm -rf "$STAGE"
            mkdir -p "$STAGE"

            tar -xzf "$TARBALL" -C "$STAGE" --no-same-owner

            for required in \
              artisan \
              vendor/autoload.php \
              public/.htaccess \
              public/build/manifest.json \
              bootstrap/ssr/ssr.js \
              deploy/activate.sh; do
              [ -f "$STAGE/$required" ] || { echo "release is missing $required"; exit 1; }
            done

            if [ -e "$STAGE/.env" ]; then
              echo "release contains .env; refusing to activate"
              exit 1
            fi

            mv "$STAGE" "$FINAL"

            bash "$FINAL/deploy/activate.sh" "$RELEASE_ID"

            rm -f "$TARBALL"

  rollback:
    name: Roll back production
    if: github.event_name == 'workflow_dispatch' && inputs.rollback_to != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || secrets.REMOTE_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || secrets.REMOTE_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}

    steps:
      - name: Verify deploy configuration
        run: |
          set -euo pipefail
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH SSH_PRIVATE_KEY SSH_HOST_FINGERPRINT; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured (repository variable or secret)"
              missing=1
            fi
          done
          exit "$missing"

      - name: Roll back
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          BASE: ${{ env.DEPLOY_PATH }}
          TARGET: ${{ inputs.rollback_to }}
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          fingerprint: ${{ env.SSH_HOST_FINGERPRINT }}
          envs: BASE,TARGET
          command_timeout: 8m
          script: |
            set -euo pipefail

            case "$TARGET" in
              *[!A-Za-z0-9._-]*)
                echo "invalid release id: $TARGET"
                exit 1
                ;;
            esac

            bash "$BASE/deploy/rollback.sh" "$TARGET"
