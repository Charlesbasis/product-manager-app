name: linter

on:
  workflow_call:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.18.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # Check only. Fixer commands are available as lint:fix / format, but CI
      # must never rewrite the working tree.
      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Check Prettier formatting
        run: pnpm run format:check

      # resources/js/routes and resources/js/actions are generated and
      # gitignored. TypeScript needs them before it can resolve @/routes.
      - name: Generate Wayfinder routes and actions
        run: php artisan wayfinder:generate --with-form

      - name: ESLint
        run: pnpm run lint

      - name: TypeScript
        run: pnpm run types
